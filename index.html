<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Tạo menu ngang</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f7f9fa;
            padding: 40px;
            margin: 0;
        }

        #menu {
            height: 40px;
            background-color: #2c3e50;
            border-radius: 4px;
        }

        #menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #menu > ul > li {
            float: left;
            position: relative;
        }

        #menu li a {
            display: block;
            min-width: 130px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            padding: 0 15px;
        }

        #menu li:hover > a {
            background-color: #e74c3c;
        }

        /* Định dạng danh sách con (menu dropdown) */
        #menu ul ul {
            position: absolute;
            top: 40px;
            left: 0;
            background-color: #34495e;
            visibility: hidden;
            min-width: 160px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 0 0 4px 4px;
            z-index: 999;
        }

        #menu ul ul li {
            float: none;
            border-bottom: 1px solid #465f78;
        }

        #menu ul ul li a {
            text-align: left;
            padding: 0 20px;
            height: 38px;
            line-height: 38px;
        }

        #menu ul ul li a:hover {
            background-color: #e74c3c;
        }

        /* Hiển thị dropdown khi hover chuột vào li cha */
        #menu ul li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Sản phẩm &#9662;</a>
                <ul>
                    <li><a href="#">Laptop & Máy tính</a></li>
                    <li><a href="#">Điện thoại di động</a></li>
                    <li><a href="#">Phụ kiện công nghệ</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ &#9662;</a>
                <ul>
                    <li><a href="#">Bảo hành phần cứng</a></li>
                    <li><a href="#">Cài đặt phần mềm</a></li>
                    <li><a href="#">Tư vấn nâng cấp</a></li>
                </ul>
            </li>
            <li><a href="#">Tin tức</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
